[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-compliance"
version = "0.1.0"
description = "生态用水履约核算后端"
requires-python = ">=3.11"

[project.scripts]
water-compliance = "water_compliance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
